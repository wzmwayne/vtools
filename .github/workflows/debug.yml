name: Debug Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK r23b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23b
          add-to-path: false
          link-to-sdk: true
          local-cache: true

      - name: Restore Android SDK cache
        uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-30
            /usr/local/lib/android/sdk/build-tools/29.0.2
            /usr/local/lib/android/sdk/cmake/3.10.2
          key: android-sdk-${{ runner.os }}-compileSdk30

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Diagnose Kotlin sources
        run: |
          cat > /tmp/diag.gradle <<'EOF'
allprojects { p ->
    p.afterEvaluate {
        if (p.path == ':common') {
            println "== :common java srcDirs =="
            println p.android.sourceSets.main.java.srcDirs
            println "== :common kotlin srcDirs =="
            println p.kotlin.sourceSets.main.kotlin.srcDirs
            def kc = p.tasks.findByName('compileDebugKotlin')
            if (kc != null) {
                println "== compileDebugKotlin inputs =="
                println kc.inputs.files.asPath.tokenize(':').findAll { it.contains('common/src') }
            }
        }
    }
}
EOF
          ./gradlew -q -I /tmp/diag.gradle help 2>&1 | head -20

      - name: Save Android SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-30
            /usr/local/lib/android/sdk/build-tools/29.0.2
            /usr/local/lib/android/sdk/cmake/3.10.2
          key: android-sdk-${{ runner.os }}-compileSdk30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scene-debug
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/app-debug.apk