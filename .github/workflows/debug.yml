name: Debug Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK r23b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23b
          add-to-path: false
          link-to-sdk: true
          local-cache: true

      - name: Restore Android SDK cache
        uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/cmake
          key: android-sdk-${{ runner.os }}-compileSdk30

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Diagnose Kotlin sources
        run: |
          ./gradlew :common:compileDebugKotlin --info --rerun-tasks 2>&1 | grep -iE "OverScrollGridView|FastBlurUtility|ShellExecutor|compileDebugJava|input source|friend|\.java" | head -60

      - name: Save Android SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/cmake
          key: android-sdk-${{ runner.os }}-compileSdk30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scene-debug
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/app-debug.apk